<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>TradeFinance Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Corporate trade finance portal: import LCs, guarantees, collections and payments.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Apply the saved dark theme before Angular starts (no light flash).
       Login screens stay light; ThemeService takes over once the app loads. -->
  <script>
    try {
      var stored = localStorage.getItem('theme');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var authPage = /^\/(login|reset-password|customer-registration)?\/?$/.test(location.pathname);
      if (dark && !authPage) document.documentElement.classList.add('dark-theme');
    } catch (e) {}
  </script>
</head>

<body class="mat-typography">
  <app-root></app-root>
</body>

</html>
