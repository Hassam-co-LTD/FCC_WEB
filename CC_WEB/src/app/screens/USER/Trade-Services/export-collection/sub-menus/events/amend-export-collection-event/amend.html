<div class="screen">
  <!-- SIDEBAR -->
  <app-sidebar [steps]="exportCollectionSteps" [currentStep]="currentStep" (stepChange)="scrollToSection($event)">
  </app-sidebar>
  <!-- MAIN CONTENT -->
  <div class="content">
    <div class="scroll-area">

      <!-- SECTIONS -->
      <section id="section-0"> <app-general-details [form]="generalDetails"></app-general-details></section>
      <hr class="section-divider" />

      <section id="section-1"><app-drawer-drawee-details [form]="DrawerDraweeDetails"></app-drawer-drawee-details></section>
      <hr class="section-divider" />

      <section id="section-2"><app-bank-details [form]="bankDetails"></app-bank-details></section>
      <hr class="section-divider" />

      <section id="section-3"><app-payment-amount [form]="PaymentAndAmount"></app-payment-amount></section>
      <hr class="section-divider" />

      <section id="section-4"><app-shipping-details [form]="ShipmentDetails"></app-shipping-details></section>
      <hr class="section-divider" />

      <section id="section-5"><app-collection-instructions [form]="CollectionInstruction"></app-collection-instructions></section>
      <hr class="section-divider" />

      <section id="section-6"><app-license></app-license></section>
      <hr class="section-divider" />

  <section id="section-7"><app-attachments-documents (filesChange)="updateAttachments($event)"></app-attachments-documents>
      </section>      <hr class="section-divider" />

         <section id="section-8">
                <router-outlet></router-outlet>
                <!-- Footer Buttons -->
                <!-- <app-preview [form]="importForm"></app-preview> -->
            </section>
     
            <!-- Footer Buttons -->
            <div class="actions">
            
                <!-- LIVE TAB: Always Save + Back -->
                <ng-container *ngIf="sourceTab === 'live'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                    <button mat-flat-button color="accent" (click)="saveForm()" [disabled]="isSaving">
                        {{ isSaving ? 'Saving...' : 'Save' }}
                    </button>
                </ng-container>
            
                <!-- PENDING TAB + CRE: Back only (read-only view) -->
                <ng-container *ngIf="sourceTab === 'pending' && eventType === 'CRE'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                </ng-container>
            
                <!-- PENDING TAB + AMD: Update + Submit -->
                <ng-container *ngIf="sourceTab === 'pending' && eventType === 'AMD'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                    <!-- <button mat-flat-button color="primary" (click)="update()">Update</button> -->
                    <button mat-flat-button color="accent" (click)="submit()">Submit</button>
                </ng-container>
            
                <!-- SUBMITTED: Approve + Reject -->
                <ng-container *ngIf="sourceTab === 'submitted' && eventType === 'AMD'">
                    <button mat-stroked-button color="primary" (click)="openReject()">Reject</button>
                    <button mat-flat-button color="accent" (click)="approve()">Approve</button>
                </ng-container>
            
                <!-- APPROVED: Back only -->
                <ng-container *ngIf="sourceTab === 'approved' && eventType === 'AMD'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                </ng-container>
            
                <!-- REJECTED: Back + Update -->
                <ng-container *ngIf="screenMode === 'EDIT' && mode === 'REJECTED'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                    <button mat-flat-button color="primary" (click)="updateRejected()">Update</button>
                </ng-container>
            
            </div>
            
        </div>
    </div>
</div>
