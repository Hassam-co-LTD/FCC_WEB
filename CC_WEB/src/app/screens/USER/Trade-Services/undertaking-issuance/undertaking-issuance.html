<div class="screen">
  <!-- Sidebar -->
  <app-sidebar
    [steps]="undertakingSteps"
    [currentStep]="currentStep"
    (stepChange)="scrollToSection($event)"
  >
  </app-sidebar>

  <!-- Main Content -->
  <div class="content">
    <div class="scroll-area">

      <!-- General Details -->
      <section id="section-0">
        <app-general-details
          [form]="generalDetails"
        ></app-general-details>
      </section>

      <hr class="section-divider" />

      <!-- Applicant & Beneficiary -->
      <section id="section-1">
        <app-application-beneficiary
          [form]="applicantBeneficiary"
        ></app-application-beneficiary>
      </section>

      <hr class="section-divider" />

      <!-- Bank Details -->
      <section id="section-2">
        <app-bank-details
          [form]="bankForm"
        ></app-bank-details>
      </section>

      <hr class="section-divider" />

      <!-- Undertaking Details -->
      <section id="section-3">
        <app-undertaking-details
          [form]="undertakingDetails"
        ></app-undertaking-details>
      </section>

      <hr class="section-divider" />

      <!-- Instructions -->
      <section id="section-4">
        <app-instructions-bank
          [form]="instructions"
        ></app-instructions-bank>
      </section>

      <hr class="section-divider" />

      <!-- Attachments -->
      <section id="section-5">
        <app-attachments></app-attachments>
      </section>

      <hr class="section-divider" />

      <!-- ================================================= -->
      <!-- ACTION BUTTONS -->
      <!-- ================================================= -->

      <div class="actions">

        <!-- ==================== CREATE ==================== -->
        <ng-container *ngIf="mode === 'CREATE'">

          <!-- Back -->
          <button
            mat-stroked-button
            color="primary"
            (click)="back()"
          >
            Back
          </button>

          <!-- Save -->
          <button
            *ngIf="hasPermission('UTG_CreateSave')"
            mat-flat-button
            color="accent"
            (click)="saveForm()"
          >
            Save
          </button>

        </ng-container>


        <!-- ==================== EDIT / PENDING ==================== -->
        <ng-container
          *ngIf="screenMode === 'EDIT' && mode === 'UPDATE'"
        >

          <!-- Update -->
          <button
            *ngIf="hasPermission('UTG_InquiryPendingUpdate')"
            mat-stroked-button
            color="primary"
            (click)="updateForm()"
          >
            Update
          </button>

          <!-- Submit -->
          <button
            *ngIf="hasPermission('UTG_InquirySubmit')"
            mat-flat-button
            color="accent"
            (click)="submitForm()"
          >
            Submit
          </button>

        </ng-container>


        <!-- ==================== APPROVAL ==================== -->
        <ng-container
          *ngIf="screenMode === 'SUBMITTED'"
        >

          <!-- Reject -->
          <button
            *ngIf="hasPermission('UTG_InquiryReject')"
            mat-stroked-button
            color="primary"
            (click)="openReject()"
          >
            Reject
          </button>

          <!-- Approve -->
          <button
            *ngIf="hasPermission('UTG_InquiryApprove')"
            mat-flat-button
            color="accent"
            (click)="approve()"
          >
            Approve
          </button>

        </ng-container>


        <!-- ==================== APPROVED ==================== -->
        <ng-container
          *ngIf="screenMode === 'APPROVED'"
        >

          <!-- Back -->
          <button
            mat-stroked-button
            color="primary"
            (click)="back()"
          >
            Back
          </button>

          <!-- Amend can be added later -->
          <!--
          <button
            *ngIf="hasPermission('UTG_Amend')"
            mat-flat-button
            color="accent"
            (click)="amend()"
          >
            Amend
          </button>
          -->

        </ng-container>


        <!-- ==================== REJECTED ==================== -->
        <ng-container
          *ngIf="screenMode === 'EDIT' && mode === 'REJECTED'"
        >

          <!-- Back -->
          <button
            mat-stroked-button
            color="primary"
            (click)="back()"
          >
            Back
          </button>

          <!-- Update Rejected -->
          <button
            *ngIf="hasPermission('UTG_InquiryRejectUpdate')"
            mat-flat-button
            color="primary"
            (click)="updateRejected()"
          >
            Update
          </button>

        </ng-container>

      </div>

    </div>
  </div>
</div>
