<div class="screen">
  <app-sidebar
    [steps]="undertakingSteps"
    [currentStep]="currentStep"
    (stepChange)="scrollToSection($event)"
  ></app-sidebar>

  <div class="content">
    <div class="scroll-area">
      <section id="section-0">
        <app-general-details
          [form]="generalDetails"
          [previousValues]="previousValues"
        ></app-general-details>
      </section>
      <hr class="section-divider" />

      <section id="section-1">
        <app-applicant-beneficiary
          [form]="applicantBeneficiary"
          [previousValues]="previousValues"
        ></app-applicant-beneficiary>
      </section>
      <hr class="section-divider" />

      <section id="section-2">
        <app-bank-details
          [form]="bankForm"
          [previousValues]="previousValues"
        ></app-bank-details>
      </section>
      <hr class="section-divider" />

      <section id="section-3">
        <app-undertaking-details
          [form]="undertakingDetails"
          [previousValues]="previousValues"
        ></app-undertaking-details>
      </section>
      <hr class="section-divider" />

      <section id="section-4">
        <app-instruction-to-bank
          [form]="instructions"
          [previousValues]="previousValues"
        ></app-instruction-to-bank>
      </section>
      <hr class="section-divider" />

      <section id="section-5"><app-attachments></app-attachments></section>
      <hr class="section-divider" />

      <div class="actions">
        <ng-container *ngIf="sourceTab === 'live'">
          <button mat-stroked-button color="primary" (click)="back()">Back</button>
          <button
            *ngIf="hasPermission('UI_AmendSave')"
            mat-flat-button
            color="accent"
            (click)="saveForm()"
            [disabled]="isSaving"
          >
            {{ isSaving ? 'Saving...' : 'Save' }}
          </button>
        </ng-container>

        <ng-container *ngIf="sourceTab === 'pending' && eventType === 'CRE'">
          <button mat-stroked-button color="primary" (click)="back()">Back</button>
        </ng-container>
<!-- PENDING TAB + AMD: Back + Update + Submit -->
<ng-container *ngIf="sourceTab === 'pending' && eventType === 'AMD'">
  <button mat-stroked-button color="primary" (click)="back()">Back</button>

  <button
    
    mat-stroked-button
    color="primary"
    (click)="update()"
    [disabled]="isSaving"
  >
    {{ isSaving ? 'Updating...' : 'Update' }}
  </button>

  <button
    *ngIf="hasPermission('UI_AmendSubmit')"
    mat-flat-button
    color="accent"
    (click)="submitForm()"
  >
    Submit
  </button>
</ng-container>
        <ng-container *ngIf="sourceTab === 'submitted' && eventType === 'AMD'">
          <button
            *ngIf="hasPermission('UI_AmendReject')"
            mat-stroked-button
            color="primary"
            (click)="openReject()"
          >
            Reject
          </button>
          <button
            *ngIf="hasPermission('UI_AmendApprove')"
            mat-flat-button
            color="accent"
            (click)="approve()"
          >
            Approve
          </button>
        </ng-container>

        <ng-container *ngIf="sourceTab === 'approved' && eventType === 'AMD'">
          <button mat-stroked-button color="primary" (click)="back()">Back</button>
        </ng-container>

        <ng-container *ngIf="screenMode === 'EDIT' && mode === 'REJECTED'">
          <button mat-stroked-button color="primary" (click)="back()">Back</button>
          <button
            *ngIf="hasPermission('UI_AmendUpdateRejected')"
            mat-flat-button
            color="primary"
            (click)="updateRejected()"
          >
            Update
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</div>
