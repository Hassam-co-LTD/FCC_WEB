<div class="screen">

  <!-- Sidebar -->
  <app-sidebar
    [steps]="exportSteps"
    [currentStep]="currentStep"
    (stepChange)="scrollToSection($event)">
  </app-sidebar>

  <!-- Main Content -->
  <div class="content">

    <div class="scroll-area">

      <section id="section-0">
        <app-general-details [form]="generalDetailsForm" [previousValues]="previousValues"></app-general-details>
      </section>

      <hr class="section-divider" />

      <section id="section-1">
        <app-upload [form]="uploadForm"></app-upload>
      </section>

      <hr class="section-divider" />

      <section id="section-2">
        <app-attachments
          (filesChange)="updateAttachments($event)">
        </app-attachments>
      </section>

      <hr class="section-divider" />

      <section id="section-3">
        <router-outlet></router-outlet>
      </section>

            <!-- Footer Buttons -->
            <div class="actions">
            
                <!-- LIVE TAB: Always Save + Back -->
                <ng-container *ngIf="sourceTab === 'live'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                    <button 
                    *ngIf="hasPermission('ILC_AmendSave')"
                    mat-flat-button color="accent" (click)="saveForm()" [disabled]="isSaving">
                        {{ isSaving ? 'Saving...' : 'Save' }}
                    </button>
                </ng-container>
            
                <!-- PENDING TAB + CRE: Back only (read-only view) -->
                <ng-container *ngIf="sourceTab === 'pending' && eventType === 'CRE'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                </ng-container>
            
                <!-- PENDING TAB + AMD: Update + Submit -->
                <ng-container *ngIf="sourceTab === 'pending' && eventType === 'AMD'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                    <button  *ngIf="hasPermission('ILC_InquiryPendingUpdate')" mat-flat-button color="primary" (click)="update()">Update</button>
                    <button
                    *ngIf="hasPermission('ILC_AmendSubmit')" mat-flat-button color="accent" (click)="submitLc()">Submit</button>
                </ng-container>
            
                <!-- SUBMITTED: Approve + Reject -->
                <ng-container *ngIf="sourceTab === 'submitted' && eventType === 'AMD'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                    <button
                    *ngIf="hasPermission('ILC_AmendPendingReject')" mat-stroked-button color="primary" (click)="openReject()">Reject</button>
                    <button
                    *ngIf="hasPermission('ILC_AmendApprove')" mat-flat-button color="accent" (click)="approve()">Approve</button>
                </ng-container>
            
                <!-- APPROVED: Back only -->
                <ng-container *ngIf="sourceTab === 'approved' && eventType === 'AMD'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                </ng-container>
            
                <!-- REJECTED: Back + Update -->
                <ng-container *ngIf="sourceTab === 'rejected' && eventType === 'AMD'">
                    <button mat-stroked-button color="primary" (click)="back()">Back</button>
                    <button 
                    *ngIf="hasPermission('ILC_AmendUpdateReject')"mat-flat-button color="primary" (click)="updateRejected()">Update</button>
                </ng-container>
            
            </div>
            
        </div>
    </div>
