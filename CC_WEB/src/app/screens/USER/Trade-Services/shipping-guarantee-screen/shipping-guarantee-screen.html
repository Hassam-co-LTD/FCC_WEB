<div class="screen">

  <!-- ===================================================== -->
  <!-- SIDEBAR -->
  <!-- ===================================================== -->

  <app-sidebar
    [steps]="shippingGuaranteeSteps"
    [currentStep]="currentStep"
    (stepChange)="scrollToSection($event)">
  </app-sidebar>


  <!-- ===================================================== -->
  <!-- MAIN CONTENT -->
  <!-- ===================================================== -->

  <div class="content">

    <div class="scroll-area">


      <!-- ================================================= -->
      <!-- GENERAL DETAILS -->
      <!-- ================================================= -->

      <section id="section-0">

        <app-general-details
          [form]="generalDetailsForm">
        </app-general-details>

      </section>

      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- APPLICANT & BENEFICIARY -->
      <!-- ================================================= -->

      <section id="section-1">

        <app-applicant-beneficiary
          [form]="applicantBeneficiaryForm">
        </app-applicant-beneficiary>

      </section>

      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- BANK DETAILS -->
      <!-- ================================================= -->

      <section id="section-2">

        <app-bank-details
          [form]="issuingbankForm">
        </app-bank-details>

      </section>

      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- INSTRUCTIONS -->
      <!-- ================================================= -->

      <section id="section-3">

        <app-instructions
          [form]="instructionForm">
        </app-instructions>

      </section>

      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- ATTACHMENTS -->
      <!-- ================================================= -->

      <section id="section-4">

        <app-attachments
          (filesChange)="updateAttachments($event)">
        </app-attachments>

      </section>


      <!-- ================================================= -->
      <!-- FOOTER BUTTONS -->
      <!-- ================================================= -->

      <div class="actions">


        <!-- ================================================= -->
        <!-- CREATE -->
        <!-- Permission: SG_CreateSave -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="mode === 'CREATE'">

          <!-- BACK -->

          <button
            mat-stroked-button
            color="primary"
            (click)="back()">

            Back

          </button>


          <!-- SAVE -->

          <button
            *ngIf="hasPermission('SG_CreateSave')"
            mat-flat-button
            color="accent"
            (click)="saveForm()">

            Save

          </button>

        </ng-container>



        <!-- ================================================= -->
        <!-- EDIT / PENDING -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="
            screenMode === 'EDIT' &&
            mode === 'UPDATE'
          ">


          <!-- UPDATE -->
          <!-- Permission: SG_InquiryPendingUpdate -->

          <button
            *ngIf="
              hasPermission(
                'SG_InquiryPendingUpdate'
              )
            "
            mat-stroked-button
            color="primary"
            (click)="update()">

            Update

          </button>


          <!-- SUBMIT -->
          <!-- Permission: SG_InquirySubmit -->

          <button
            *ngIf="
              hasPermission(
                'SG_InquirySubmit'
              )
            "
            mat-flat-button
            color="accent"
            (click)="submitGuarantee()">

            Submit

          </button>

        </ng-container>



        <!-- ================================================= -->
        <!-- APPROVAL -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="
            screenMode === 'SUBMITTED'
          ">


          <!-- REJECT -->
          <!-- Permission: SG_InquiryReject -->

          <button
            *ngIf="
              hasPermission(
                'SG_InquiryReject'
              )
            "
            mat-stroked-button
            color="primary"
            (click)="openReject()">

            Reject

          </button>


          <!-- APPROVE -->
          <!-- Permission: SG_InquiryApprove -->

          <button
            *ngIf="
              hasPermission(
                'SG_InquiryApprove'
              )
            "
            mat-flat-button
            color="accent"
            (click)="approve()">

            Approve

          </button>

        </ng-container>



        <!-- ================================================= -->
        <!-- APPROVED -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="
            screenMode === 'APPROVED'
          ">

          <button
            mat-stroked-button
            color="primary"
            (click)="back()">

            Back

          </button>

        </ng-container>



        <!-- ================================================= -->
        <!-- REJECTED -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="
            screenMode === 'EDIT' &&
            mode === 'REJECTED'
          ">


          <!-- BACK -->

          <button
            mat-stroked-button
            color="primary"
            (click)="back()">

            Back

          </button>


          <!-- UPDATE REJECTED -->
          <!-- Permission: SG_InquiryRejectUpdate -->

          <button
            *ngIf="
              hasPermission(
                'SG_InquiryRejectUpdate'
              )
            "
            mat-flat-button
            color="primary"
            (click)="updateRejected()">

            Update

          </button>

        </ng-container>


      </div>

    </div>

  </div>

</div>
