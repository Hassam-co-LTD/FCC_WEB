<div class="screen">

  <!-- ===================================================== -->
  <!-- SIDEBAR -->
  <!-- ===================================================== -->

  <app-sidebar
    [steps]="importSteps"
    [currentStep]="currentStep"
    (stepChange)="scrollToSection($event)">
  </app-sidebar>


  <!-- ===================================================== -->
  <!-- MAIN CONTENT -->
  <!-- ===================================================== -->

  <div class="content">

    <div class="scroll-area">


      <!-- ================================================= -->
      <!-- GENERAL DETAILS -->
      <!-- ================================================= -->

      <section id="section-0">

        <app-general-details
          [form]="generalDetailsForm">
        </app-general-details>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- APPLICANT / BENEFICIARY -->
      <!-- ================================================= -->

      <section id="section-1">

        <app-applicant-beneficiary
          [form]="applicantForm">
        </app-applicant-beneficiary>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- BANK DETAILS -->
      <!-- ================================================= -->

      <section id="section-2">

        <app-bank-details
          [form]="bankForm">
        </app-bank-details>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- AMOUNT & CHARGES -->
      <!-- ================================================= -->

      <section id="section-3">

        <app-amount-charge-details
          [form]="amountChargeForm">
        </app-amount-charge-details>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- PAYMENT DETAILS -->
      <!-- ================================================= -->

      <section id="section-4">

        <app-payment-details
          [form]="paymentDetailsForm">
        </app-payment-details>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- SHIPMENT DETAILS -->
      <!-- ================================================= -->

      <section id="section-5">

        <app-shipment-details
          [form]="shipmentForm">
        </app-shipment-details>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- NARRATIVE DETAILS -->
      <!-- ================================================= -->

      <section id="section-6">

        <app-narrative-details
          [form]="narrativeForm">
        </app-narrative-details>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- LICENSES -->
      <!-- ================================================= -->

      <section id="section-7">

        <app-licenses>
        </app-licenses>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- INSTRUCTIONS TO BANK -->
      <!-- ================================================= -->

      <section id="section-8">

        <app-instruction-to-bank
          [form]="instructionForm">
        </app-instruction-to-bank>

      </section>


      <hr class="section-divider" />


      <!-- ================================================= -->
      <!-- ATTACHMENTS -->
      <!-- ================================================= -->

      <section id="section-9">

        <app-attachments
          (filesChange)="updateAttachments($event)">
        </app-attachments>

      </section>


      <!-- ================================================= -->
      <!-- FOOTER BUTTONS -->
      <!-- ================================================= -->

      <div class="actions">


        <!-- ================================================= -->
        <!-- CREATE -->
        <!-- Permission: ILC_CreateSave -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="mode === 'CREATE'">

          <button
            mat-stroked-button
            color="primary"
            (click)="back()">

            Back

          </button>


          <button
            *ngIf="
              hasPermission('ILC_CreateSave')
            "
            mat-flat-button
            color="accent"
            (click)="saveForm()">

            Save

          </button>

        </ng-container>


        <!-- ================================================= -->
        <!-- EDIT / AMEND -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="
            screenMode === 'EDIT' &&
            mode === 'UPDATE'
          ">


          <!-- =============================================== -->
          <!-- UPDATE -->
          <!-- Permission: ILC_InquiryPendingUpdate -->
          <!-- =============================================== -->

          <button
            *ngIf="
              hasPermission(
                'ILC_InquiryPendingUpdate'
              )
            "
            mat-stroked-button
            color="primary"
            (click)="update()">

            Update

          </button>


          <!-- =============================================== -->
          <!-- SUBMIT -->
          <!-- Permission: ILC_InquirySubmit -->
          <!-- =============================================== -->

          <button
            *ngIf="
              hasPermission(
                'ILC_InquirySubmit'
              )
            "
            mat-flat-button
            color="accent"
            (click)="submitLc()">

            Submit

          </button>

        </ng-container>


        <!-- ================================================= -->
        <!-- APPROVAL -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="
            screenMode === 'SUBMITTED'
          ">


          <!-- =============================================== -->
          <!-- REJECT -->
          <!-- Permission: ILC_InquiryReject -->
          <!-- =============================================== -->

          <button
            *ngIf="
              hasPermission(
                'ILC_InquiryReject'
              )
            "
            mat-stroked-button
            color="primary"
            (click)="openReject()">

            Reject

          </button>


          <!-- =============================================== -->
          <!-- APPROVE -->
          <!-- Permission: ILC_InquiryApprove -->
          <!-- =============================================== -->

          <button
            *ngIf="
              hasPermission(
                'ILC_InquiryApprove'
              )
            "
            mat-flat-button
            color="accent"
            (click)="approve()">

            Approve

          </button>

        </ng-container>


        <!-- ================================================= -->
        <!-- APPROVED -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="
            screenMode === 'APPROVED'
          ">

          <button
            mat-stroked-button
            color="primary"
            (click)="back()">

            Back

          </button>

        </ng-container>


        <!-- ================================================= -->
        <!-- REJECTED -->
        <!-- ================================================= -->

        <ng-container
          *ngIf="
            screenMode === 'EDIT' &&
            mode === 'REJECTED'
          ">


          <button
            mat-stroked-button
            color="primary"
            (click)="back()">

            Back

          </button>


          <!-- =============================================== -->
          <!-- UPDATE REJECTED -->
          <!-- Permission: ILC_InquiryRejectUpdate -->
          <!-- =============================================== -->

          <button
            *ngIf="
              hasPermission(
                'ILC_InquiryRejectUpdate'
              )
            "
            mat-flat-button
            color="primary"
            (click)="updateRejected()">

            Update

          </button>

        </ng-container>


      </div>

    </div>

  </div>

</div>
