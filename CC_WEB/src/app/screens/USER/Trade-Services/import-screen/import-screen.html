<div class="screen">
  <!-- Sidebar -->
  <app-sidebar
    [steps]="importSteps"
    [currentStep]="currentStep"
    (stepChange)="scrollToSection($event)"
  >
  </app-sidebar>
  <!-- Main Content -->
  <div class="content">
    <div class="scroll-area">
      <section id="section-0">
        <app-general-details
          [form]="generalDetailsForm"
          [previousValues]="previousValues"
        ></app-general-details>
      </section>
      <hr class="section-divider" />

      <section id="section-1">
        <app-applicant-beneficiary
          [form]="applicantForm"
          [previousValues]="previousValues"
        ></app-applicant-beneficiary>
      </section>
      <hr class="section-divider" />

      <section id="section-2">
        <app-bank-details
          [form]="bankForm"
          [previousValues]="previousValues"
        ></app-bank-details>
      </section>
      <hr class="section-divider" />

      <section id="section-3">
        <app-amount-charge-details
          [form]="amountChargeForm"
          [previousValues]="previousValues"
        ></app-amount-charge-details>
      </section>
      <hr class="section-divider" />

      <section id="section-4">
        <app-payment-details
          [form]="paymentDetailsForm"
          [previousValues]="previousValues"
        ></app-payment-details>
      </section>
      <hr class="section-divider" />

      <section id="section-5">
        <app-shipment-details
          [form]="shipmentForm"
          [previousValues]="previousValues"
        ></app-shipment-details>
      </section>
      <hr class="section-divider" />

      <section id="section-6">
        <app-narrative-details
          [form]="narrativeForm"
          [previousValues]="previousValues"
        ></app-narrative-details>
      </section>
      <hr class="section-divider" />

      <section id="section-7"><app-licenses></app-licenses></section>
      <hr class="section-divider" />

      <section id="section-8">
        <app-instruction-to-bank
          [form]="instructionForm"
          [previousValues]="previousValues"
        ></app-instruction-to-bank>
      </section>
      <hr class="section-divider" />

      <section id="section-9">
        <app-attachments
          (filesChange)="updateAttachments($event)"
        ></app-attachments>

        <!-- dynamic Fields section  -->
        <ng-container *ngIf="fields?.length">
          <app-dynamic-fields
            [form]="dynamicFieldsForm"
            [fields]="fields"
            [isOpen]="isDynamicFieldsOpen"
            [previousDynamicValues]="previousDynamicValues"
          >
          </app-dynamic-fields>
        </ng-container>
      </section>
      <hr class="section-divider" />

      <!-- Footer Buttons -->
      <div class="actions">
        <button mat-stroked-button (click)="back()">Back</button>

        <!-- CREATE -->
        <ng-container *ngIf="mode === 'CREATE'">
          <button
            *ngIf="hasPermission('ILC_CreateSave')"
            mat-flat-button
            color="accent"
            (click)="saveForm()"
          >
            Save
          </button>
        </ng-container>

        <!-- EDIT -->
        <ng-container *ngIf="screenMode === 'EDIT' && mode === 'UPDATE'">
          <button
            *ngIf="hasPermission('ILC_InquiryPendingUpdate')"
            mat-stroked-button
            color="primary"
            (click)="update()"
          >
            Update
          </button>
          <button
            *ngIf="hasPermission('ILC_InquirySubmit')"
            mat-flat-button
            color="accent"
            (click)="submitLc()"
          >
            Submit
          </button>
        </ng-container>

        <!-- APPROVAL -->
        <ng-container *ngIf="screenMode === 'SUBMITTED'">
          <button
            *ngIf="hasPermission('ILC_InquiryReject')"
            mat-stroked-button
            color="primary"
            (click)="openReject()"
          >
            Reject
          </button>

          <button
            *ngIf="hasPermission('ILC_InquiryApprove')"
            mat-flat-button
            color="accent"
            (click)="approve()"
          >
            Approve
          </button>
        </ng-container>

        <!-- REJECTED -->
        <ng-container *ngIf="screenMode === 'EDIT' && mode === 'REJECTED'">
          <button
            *ngIf="hasPermission('ILC_InquiryRejectUpdate')"
            mat-flat-button
            color="primary"
            (click)="updateRejected()"
          >
            Update
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</div>
