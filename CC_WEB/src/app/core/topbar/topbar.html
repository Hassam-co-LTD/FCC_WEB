<header class="topbar">
  <!-- Group hamburger + title -->
  <div class="left-group">
    <div class="brand" routerLink="/dashboard" aria-label="TradeFinance Portal">
      <!-- Exchange-arrows mark; inline so it follows the light/dark theme -->
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="brandMarkGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b4eb3" />
            <stop offset="1" stop-color="#1e88e5" />
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="10" fill="url(#brandMarkGradient)" />
        <path
          d="M11 15h17m-4.5-4.5L28 15l-4.5 4.5M29 25H12m4.5-4.5L12 25l4.5 4.5"
          fill="none"
          stroke="#fff"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="brand-text">
        <span class="brand-name">Trade<strong>Finance</strong></span>
        <span class="brand-tag">Corporate Banking Portal</span>
      </span>
    </div>
  </div>

  <!-- Center Navigation -->
  <nav class="nav" [class.open]="menuVisible">
    <a routerLink="/dashboard" class="nav-link">Dashboard</a>

    <!-- Trade Services Dropdown -->
    <div class="dropdown">
      <button class="menu-btn" (click)="toggleMenu()" [class.active]="menuOpen">
        Trade Services
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      @if (menuOpen) {
      <ul class="dropdown-menu">
        <li>
          <button
            [routerLink]="['/dashboard/Trade-Services/import-welcome']"
            (click)="closeMenu()"
          >
            Import LC
          </button>
        </li>
        <!-- <li><button [routerLink]="['/dashboard/Trade-Services/exportlc-welcome']" (click)="closeMenu()">Export LC</button></li> -->
        <li>
          <button
            [routerLink]="['/dashboard/Trade-Services/shipping-welcome']"
            (click)="closeMenu()"
          >
            Shipping Guarantee
          </button>
        </li>
        <li>
          <button
            [routerLink]="['/dashboard/Trade-Services/export-collection']"
            (click)="closeMenu()"
          >
            Export Collection
          </button>
        </li>
        <li>
          <button
            [routerLink]="['/dashboard/Trade-Services/undertaking-welcome']"
            (click)="closeMenu()"
          >
            Undertaking Guarantee
          </button>
        </li>
      </ul>
      }
    </div>

    <div class="user-meta">
      <span class="user-name">{{ userName }}</span>
      <span class="last-login">Last login: {{ lastGoodLogin }}</span>
    </div>
  </nav>

  <!-- Right User Menu -->
  <div class="right">
    <button
      mat-icon-button
      class="icon-btn theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <mat-icon>{{ theme.isDark() ? "light_mode" : "dark_mode" }}</mat-icon>
    </button>

    <button mat-icon-button class="icon-btn" aria-label="Notifications">
      <mat-icon>notifications</mat-icon>
    </button>

    <button mat-button [matMenuTriggerFor]="userMenu" class="profile-btn">
      <span class="avatar">{{ Name.charAt(0) }}</span>
      <!-- <span class="name">{{ Name }}</span> -->
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" class="profile-menu" xPosition="before">
      <div class="menu-header">
        <span class="menu-avatar">{{ Name.charAt(0) }}</span>
        <div class="menu-header-text">
          <span class="menu-name">{{ Name }}</span>
          <span class="menu-role">{{ userName }}</span>
        </div>
      </div>

      <mat-divider></mat-divider>

      <!-- <button mat-menu-item class="menu-row">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>

      <button mat-menu-item class="menu-row">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button> -->

      <button mat-menu-item class="menu-row" (click)="goToChangePassword()">
        <mat-icon>lock</mat-icon>
        <span>Change Password</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item class="menu-row logout-item">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</header>
