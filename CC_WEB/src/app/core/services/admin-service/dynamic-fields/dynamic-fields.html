<!-- =========================
     DYNAMIC CUSTOMER FIELDS
========================== -->
<div
  class="customer-form-wrapper dynamic-fields-section"
  [formGroup]="form"
>

  <!-- Section Header -->
  <div class="section-header" (click)="toggleDynamicFields()">
    <h2>Customer Additional Fields</h2>

    <mat-icon>
      {{ isOpen ? 'expand_less' : 'expand_more' }}
    </mat-icon>
  </div>

  <!-- Dynamic Fields -->
  <div class="collapsible" [class.open]="isOpen">

    <div class="form-grid">

      <ng-container *ngFor="let field of fields">

        <div class="field-group">

          <h4>
            {{ field.label || field.fieldName }}
          </h4>

          <!-- TEXT -->
          <mat-form-field
            *ngIf="field.fieldType === 'text'"
            appearance="outline"
          >
            <input
              matInput
              [formControlName]="field.fieldName"
              [placeholder]="field.label || field.fieldName"
            />
          </mat-form-field>

          <!-- NUMBER -->
          <mat-form-field
            *ngIf="field.fieldType === 'number'"
            appearance="outline"
          >
            <input
              matInput
              type="number"
              [formControlName]="field.fieldName"
              [placeholder]="field.label || field.fieldName"
            />
          </mat-form-field>

          <!-- DATE -->
          <mat-form-field
            *ngIf="field.fieldType === 'date'"
            appearance="outline"
          >
            <input
              matInput
              type="date"
              [formControlName]="field.fieldName"
              [placeholder]="field.label || field.fieldName"
            />
          </mat-form-field>

          <!-- SELECT -->
          <mat-form-field
            *ngIf="field.fieldType === 'select'"
            appearance="outline"
          >
            <mat-label>
              {{ field.label || field.fieldName }}
            </mat-label>

            <mat-select [formControlName]="field.fieldName">
              <mat-option value="">
                Select {{ field.label || field.fieldName }}
              </mat-option>

              <mat-option
                *ngFor="let option of field.options || []"
                [value]="option.value"
              >
                {{ option.text }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <!-- PREVIOUS VALUE (shown once, for any field type) -->
          <div
            class="previous-value"
            *ngIf="hasPreviousDynamicValue(field.fieldId)"
          >
            <span class="previous-label">Previous Value:</span>
            <span class="previous-text">
              {{ getPreviousDynamicValue(field.fieldId) }}
            </span>
          </div>

        </div>

      </ng-container>

    </div>

  </div>

</div>
